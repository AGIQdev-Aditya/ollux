[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ollux"
version = "0.1.0"
description = "Ultra-lightweight native Linux desktop client for Ollama with reasoning controls and live benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aditya Sharma" }
]
keywords = ["ollama", "ai", "llm", "chat", "reasoning", "linux", "arch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pywebview>=5.0.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "ddgs>=1.0.0",
]

[project.scripts]
ollux = "src.main:main"

[project.urls]
Homepage = "https://github.com/AGIQdev-Aditya/ollux"
Repository = "https://github.com/AGIQdev-Aditya/ollux"
Issues = "https://github.com/AGIQdev-Aditya/ollux/issues"
