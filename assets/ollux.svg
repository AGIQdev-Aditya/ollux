<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>
    <linearGradient id="llama-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="6" />

  <!-- Llama Stylized Silhouette -->
  <g filter="url(#neon-glow)" fill="url(#llama-grad)">
    <!-- Ears -->
    <path d="M190 120 L210 180 L180 180 Z" />
    <path d="M230 110 L250 180 L220 180 Z" />
    
    <!-- Head and Snout -->
    <path d="M180 180 Q190 160 250 160 Q290 160 300 200 L320 230 Q330 250 310 260 L270 260 L270 330 Q270 360 250 380 L220 400 L210 400 L200 370 L210 320 L200 240 Q180 220 180 180 Z" />
    
    <!-- Eye -->
    <circle cx="260" cy="205" r="9" fill="#0a0e14" />
    <circle cx="262" cy="203" r="3" fill="#ffffff" />
  </g>

  <!-- Speed Lightning Bolt Accent -->
  <path d="M340 310 L310 370 L345 370 L325 430 L395 350 L350 350 Z" fill="#00e5ff" opacity="0.9" filter="url(#neon-glow)" />
</svg>
