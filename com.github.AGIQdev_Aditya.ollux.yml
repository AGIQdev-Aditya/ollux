app-id: com.github.AGIQdev_Aditya.ollux
runtime: org.gnome.Platform
runtime-version: '45'
sdk: org.gnome.Sdk
command: run.sh
finish-args:
  # Allow access to localhost:11434 (Ollama daemon)
  - --share=network
  # IPC for X11/Wayland sharing
  - --share=ipc
  # Display servers
  - --socket=wayland
  - --socket=fallback-x11
  # Hardware acceleration in WebKitGTK
  - --device=dri
  # Required for drag-and-drop URI parsing of native host files
  - --filesystem=home

modules:
  # Note: In a real submission to Flathub, Python dependencies (pywebview, requests, pypdf, ddgs)
  # should be generated using flatpak-pip-generator into a separate python-deps.json module.
  
  - name: ollux
    buildsystem: simple
    build-commands:
      - install -d /app/bin
      - install -m 755 run.sh /app/bin/run.sh
      - cp -r src /app/src
      - cp -r assets /app/assets
      - install -Dm644 ollux.desktop /app/share/applications/com.github.AGIQdev_Aditya.ollux.desktop
      - install -Dm644 assets/ollux.svg /app/share/icons/hicolor/scalable/apps/com.github.AGIQdev_Aditya.ollux.svg
    sources:
      - type: dir
        path: .
